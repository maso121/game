name: screw_puzzle
description: A production-ready hyper-realistic screw puzzle game
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  flame_riverpod: ^5.0.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  audioplayers: ^6.0.0
  shared_preferences: ^2.3.2
  equatable: ^2.0.5
  collection: ^1.18.0
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
